name: UI Automation (FlaUI + WinAppDriver)

on:
  push:
    branches: [main, master]
    paths:
      - 'MainAPP/**'
      - 'MainAPP.UIAutomation/**'
      - 'ci/**'
      - '.github/workflows/ui-automation.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'MainAPP/**'
      - 'MainAPP.UIAutomation/**'
      - 'ci/**'
      - '.github/workflows/ui-automation.yml'
  workflow_dispatch:

jobs:
  ui-automation:
    name: FlaUI + WinAppDriver E2E
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install WinAppDriver (choco)
        shell: powershell
        run: |
          choco install winappdriver -y --no-progress
          # 校验安装结果
          $wad = "C:\Program Files\Windows Application Driver\WinAppDriver.exe"
          if (Test-Path $wad) {
            Write-Host "WinAppDriver 已安装到 $wad"
          } else {
            Write-Host "::warning::WinAppDriver 未通过 choco 安装成功，Appium 冒烟测试将被跳过"
          }

      - name: Build MainAPP.UIAutomation
        shell: powershell
        run: |
          dotnet build MainAPP.UIAutomation/MainAPP.UIAutomation.csproj -c Debug --nologo

      - name: Run UI automation tests (with WinAppDriver)
        shell: powershell
        run: |
          .\ci\run-ui-automation.ps1 -WithWinAppDriver -Configuration Debug

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-automation-logs
          path: |
            MainAPP.UIAutomation/TestResults/
            MainAPP.UIAutomation/bin/Debug/net10.0-windows/*.log
          if-no-files-found: ignore
          retention-days: 7
