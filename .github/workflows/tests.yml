name: Tests (Unit + Integration + E2E + Coverage)

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
    paths:
      - 'MainAPP/**'
      - 'MainAPP.Tests/**'
      - 'MainAPP.E2E/**'
      - 'MainAPP.Benchmarks/**'
      - 'LicenseManager.App/**'
      - 'LicenseIssuer.CLI/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'Kanban.slnx'
      - '.runsettings'
      - 'MainAPP/DLLS/**'
      - 'MainAPP/Data/Migrations/**'
      - '.editorconfig'
      - 'Kanban.Collector/**'
      - 'Kanban.Collector.Core/**'
      - 'Kanban.Contracts/**'
      - 'Kanban.Client/**'
      - 'Kanban.Web/**'
      - 'ci/**'
      - 'Kanban.Web/Localization.cs'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'MainAPP/**'
      - 'MainAPP.Tests/**'
      - 'MainAPP.E2E/**'
      - 'MainAPP.Benchmarks/**'
      - 'LicenseManager.App/**'
      - 'LicenseIssuer.CLI/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'Kanban.slnx'
      - '.runsettings'
      - 'MainAPP/DLLS/**'
      - 'MainAPP/Data/Migrations/**'
      - '.editorconfig'
      - 'Kanban.Collector/**'
      - 'Kanban.Collector.Core/**'
      - 'Kanban.Contracts/**'
      - 'Kanban.Client/**'
      - 'Kanban.Web/**'
      - 'ci/**'
      - 'Kanban.Web/Localization.cs'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: Build & Run Tests
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Kill leftover testhost processes (avoid file lock on DLLs)
        shell: powershell
        run: |
          Get-Process testhost -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process testhost.x86 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Restore
        shell: powershell
        run: dotnet restore Kanban.slnx --nologo

      - name: Install EF Core CLI
        shell: powershell
        run: dotnet tool install --global dotnet-ef --version 10.0.10 --no-cache

      - name: Build (Debug)
        shell: powershell
        run: dotnet build Kanban.slnx -c Debug --no-restore --nologo

      - name: Verify EF Core migrations
        shell: powershell
        run: |
          dotnet ef migrations list --project MainAPP/MainAPP.csproj --context ProductionLogDbContext --no-build
          dotnet ef migrations list --project MainAPP/MainAPP.csproj --context AlarmEventDbContext --no-build
          dotnet ef migrations list --project MainAPP/MainAPP.csproj --context StatusTransitionDbContext --no-build
          dotnet ef migrations list --project MainAPP/MainAPP.csproj --context WorkOrderDbContext --no-build

      - name: Run MainAPP.Tests (Unit + Integration)
        shell: powershell
        run: |
          dotnet test --project MainAPP.Tests/MainAPP.Tests.csproj `
            -c Debug --no-build --nologo `
            --results-directory TestResults `
            --coverlet `
            --coverlet-output-format cobertura `
            --coverlet-file-prefix mainapp-tests `
            --report-xunit-trx `
            --report-xunit-trx-filename mainapp-tests.trx

      - name: Run MainAPP.E2E
        shell: powershell
        run: |
          dotnet test --project MainAPP.E2E/MainAPP.E2E.csproj `
            -c Debug --no-build --nologo `
            --results-directory TestResults `
            --report-xunit-trx `
            --report-xunit-trx-filename mainapp-e2e.trx

      - name: Verify Strings.cs & L.cs are up-to-date (single source guard)
        shell: powershell
        run: |
          python ci/generate_wpf_strings.py --check
          python ci/generate_web_loc.py --check
          python ci/scan_bare_stringformat.py

      - name: Build Release (verify Obfuscar + Release config)
        shell: powershell
        run: dotnet build Kanban.slnx -c Release --nologo

      - name: Publish MainAPP Release artifact
        shell: powershell
        run: |
          dotnet publish MainAPP/MainAPP.csproj -c Release --no-restore --no-self-contained `
            -r win-x64 -o artifacts/MainAPP

      - name: Upload MainAPP Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: MainAPP-win-x64-${{ github.sha }}
          path: artifacts/MainAPP/**
          if-no-files-found: error
          retention-days: 14

      - name: Run Benchmarks
        shell: powershell
        continue-on-error: true
        run: |
          dotnet run --project MainAPP.Benchmarks/MainAPP.Benchmarks.csproj `
            -c Release --no-build `
            -- --job short --filter '*' --exporters json,html `
               --memory --iterationCount 3 --warmupCount 1 `
               --loggers console `
               --artifacts TestResults/Benchmarks

      - name: Generate coverage report
        if: always()
        shell: powershell
        run: |
          # 安装 ReportGenerator 工具（如未安装）
          dotnet tool install -g dotnet-reportgenerator-globaltool --ignore-failed-sources 2>$null
          # 查找 MTP Coverlet 生成的 Cobertura 文件（文件名包含时间戳）
          $coverageFiles = Get-ChildItem -Path TestResults -Recurse -Filter "*coverage.cobertura*.xml" -ErrorAction SilentlyContinue
          if ($coverageFiles) {
            $coverageFile = $coverageFiles[0].FullName
            Write-Host "Found coverage file: $coverageFile"
            reportgenerator -reports:"$coverageFile" -targetdir:"CoverageReport" -reporttypes:"Html;Cobertura;TextSummary"
            # 输出覆盖率摘要到日志
            Get-Content CoverageReport/Summary.txt -ErrorAction SilentlyContinue
            # 阈值门禁：整体行覆盖率低于 60% 时 CI 失败（防覆盖倒退）。
            # 口径说明：MainAPP.Tests 自引用 Kanban.Collector 服务端后，服务端代码进入覆盖分母，
            # 实测整体约 64%（2026-08-03 基线），阈值取 60% 留缓冲。
            [xml]$xml = Get-Content $coverageFile
            $lineRate = [double]$xml.coverage.'line-rate'
            Write-Host "Line coverage: $([math]::Round($lineRate * 100, 2))%"
            if ($lineRate -lt 0.60) {
              Write-Host "::error::Line coverage $([math]::Round($lineRate * 100, 2))% below threshold 60% (coverage regression)"
              exit 1
            }
          } else {
            Write-Host "::error::No coverage file found (coverage gate cannot run)"
            exit 1
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            CoverageReport/**
            TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: TestResults/Benchmarks/**/*
          if-no-files-found: ignore
          retention-days: 30

  publish-bundle:
    name: Publish Self-Contained Deployment Bundle
    runs-on: windows-2022
    timeout-minutes: 60
    needs: test  # only build the deployment bundle after unit/integration/E2E pass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm-tools workload (for WASM publish)
        shell: powershell
        run: dotnet workload install wasm-tools --nologo

      - name: Restore
        shell: powershell
        run: dotnet restore Kanban.slnx --nologo

      - name: Publish all programs (self-contained) into one dir
        shell: powershell
        run: .\ci\publish-all.ps1 -Configuration Release -SelfContained -Runtime win-x64 -OutputDir artifacts/publish

      - name: Upload self-contained bundle
        uses: actions/upload-artifact@v4
        with:
          name: Kanban-bundle-selfcontained-${{ github.sha }}
          path: artifacts/publish/**
          if-no-files-found: error
          retention-days: 14

      - name: WASM smoke (boot the published bundle + headless Edge assertions)
        # Runs the bundle's Collector with an isolated DataRoot, then invokes ci/wasm-smoke.js
        # via playwright-core + system Edge to verify the WASM big-screen boots and renders.
        # 正式门禁：WASM 展示端是发布形态的核心产物，启动失败/smoke 断言失败即视为不合格
        # （此前 best-effort 允许失败会掩盖发布包损坏）。完整数据流 smoke（设备/OEE）本地跑：
        #   copy run-demo/data Config to a temp dir, start the bundle's Collector+Sim, then
        #   node ci/wasm-smoke.js http://127.0.0.1:5129/ 45  for the complete 16-assertion smoke.
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $repoRoot = $env:GITHUB_WORKSPACE
          $bundle = Join-Path $repoRoot "artifacts\publish"
          $collExe = Join-Path $bundle "Collector\Kanban.Collector.exe"
          $smokeData = Join-Path $repoRoot "artifacts\smoke-data"
          $wsDir = Join-Path $env:HOME ".workbuddy\binaries\node\workspace"
          if (-not (Test-Path $collExe)) { Write-Host "::error::bundle Collector missing"; exit 1 }
          if (Test-Path $smokeData) { Remove-Item $smokeData -Recurse -Force }
          New-Item -ItemType Directory -Path (Join-Path $smokeData "Config") -Force | Out-Null
          # Start the published Collector with an isolated DataRoot (no devices -> structural smoke)
          $env:KANBAN_DATA_DIR = $smokeData
          $coll = Start-Process -FilePath $collExe -WorkingDirectory (Split-Path $collExe) -PassThru
          Start-Sleep -Seconds 8
          $health = try { (Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 "http://127.0.0.1:5129/healthz").StatusCode } catch { 0 }
          if ($health -ne 200) { Write-Host "::error::bundle Collector healthz=$health, WASM smoke aborted"; Stop-Process -Id $coll.Id -Force -ErrorAction SilentlyContinue; exit 1 }
          # playwright-core lives in the managed node workspace; copy smoke script alongside it
          Copy-Item -Path (Join-Path $repoRoot "ci\wasm-smoke.js") -Destination $wsDir -Force
          Push-Location $wsDir
          $env:KANBAN_REPO = $repoRoot -replace '\\','/'
          try {
            node wasm-smoke.js http://127.0.0.1:5129/ 35
          } finally {
            Pop-Location
            Stop-Process -Id $coll.Id -Force -ErrorAction SilentlyContinue
          }
