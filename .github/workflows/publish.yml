name: Publish Deployment Bundle

permissions:
  contents: read

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Release tags must build exactly once

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      self_contained:
        description: 'Bundle .NET runtime (target machine needs no SDK)'
        type: boolean
        default: true
      runtime:
        description: 'Target runtime identifier'
        type: choice
        required: true
        default: 'win-x64'
        options:
          - win-x64
          - win-x86
          - win-arm64
      configuration:
        description: 'Build configuration'
        type: choice
        required: true
        default: 'Release'
        options:
          - Release
          - Debug
      include_simulator:
        description: 'Include PlcSimulator in the bundle'
        type: boolean
        default: true

jobs:
  # 发布门禁：正式 Release 必须先跑通单元/集成测试（与 tests.yml 同口径的 dotnet test）。
  # 跨 workflow 无法复用 tests.yml 的 job，故在发布流程内内置前置测试 job；
  # tests.yml（push/PR 路径触发）仍是日常回归主力，本 job 只保证"发版当时代码是绿的"。
  run-tests:
    name: Gate - Unit & Integration Tests
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Kill leftover testhost processes (avoid file lock on DLLs)
        shell: powershell
        run: |
          Get-Process testhost -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process testhost.x86 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Restore
        shell: powershell
        run: dotnet restore Kanban.slnx --nologo

      - name: Build (Debug)
        shell: powershell
        run: dotnet build Kanban.slnx -c Debug --no-restore --nologo

      - name: Run MainAPP.Tests (Unit + Integration)
        shell: powershell
        run: |
          dotnet test --project MainAPP.Tests/MainAPP.Tests.csproj `
            -c Debug --no-build --nologo `
            --results-directory TestResults `
            --report-xunit-trx `
            --report-xunit-trx-filename publish-gate-tests.trx

      - name: Upload gate test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-gate-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7

  publish-bundle:
    name: Publish ${{ inputs.configuration || 'Release' }} Bundle (${{ inputs.runtime || 'win-x64' }})
    runs-on: windows-2022
    timeout-minutes: 60
    needs: [run-tests]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm-tools workload (for WASM publish)
        shell: powershell
        run: dotnet workload install wasm-tools --nologo

      - name: Resolve bundle parameters
        id: params
        shell: powershell
        run: |
          $self = '${{ inputs.self_contained }}'
          $runtime = '${{ inputs.runtime }}'
          $config = '${{ inputs.configuration }}'
          $includeSim = '${{ inputs.include_simulator }}'
          $ref = '${{ github.ref }}'
          $refShort = $ref -replace '^refs/(tags|heads)/', ''
          "self_contained=$self" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "runtime=$runtime"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "config=$config"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "include_sim=$includeSim" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ref_short=$refShort" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore
        shell: powershell
        run: dotnet restore Kanban.slnx --nologo

      - name: Publish all programs into one dir
        shell: powershell
        run: |
          $args = @("publish-all.ps1", "-Configuration", "${{ steps.params.outputs.config }}", "-Runtime", "${{ steps.params.outputs.runtime }}", "-OutputDir", "artifacts\publish")
          if ('${{ steps.params.outputs.self_contained }}' -eq 'true') { $args += "-SelfContained" }
          if ('${{ steps.params.outputs.include_sim }}' -ne 'true')   { $args += "-SkipSim" }
          .\ci\publish-all.ps1 @args

      - name: Generate SHA-256 checksum manifest
        shell: powershell
        run: |
          $dir = "artifacts\publish"
          $manifest = Join-Path $dir "SHA256SUMS.txt"
          Get-ChildItem -Path $dir -Recurse -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $rel = $_.FullName.Substring((Resolve-Path $dir).Path.Length + 1).Replace('\', '/')
            "$hash  $rel" | Out-File -FilePath $manifest -Append -Encoding ascii
          }
          Write-Host "SHA256 manifest written: $manifest"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: Kanban-bundle-${{ steps.params.outputs.config }}-${{ steps.params.outputs.runtime }}-${{ steps.params.outputs.ref_short }}
          path: artifacts/publish/**
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (push tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/publish/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}