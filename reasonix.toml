\\$path = 'D:\\SourceCode\\Kanban0731\\Kanban\\ci\\install-sim-services.ps1'\n\\$content = [System.IO.File]::ReadAllText(\\$path, [System.Text.Encoding]::UTF8)\n\\$utf8Bom = New-Object System.Text.UTF8Encoding \\$true\n[System.IO.File]::WriteAllText(\\$path, \\$content, \\$utf8Bom)\n\\$errors = \\$null\n[System.Management.Automation.Language.Parser]::ParseFile(\\$path, [ref]\\$null, [ref]\\$errors) | Out-Null\nif (\\$errors.Count -eq 0) { Write-Host 'PARSE_OK' } else { Write-Host ('PARSE_ERROR: ' + \\$errors.Count) }\n\" 2>&1 | tail -2", "Bash=cd /d/SourceCode/Kanban0731/Kanban && powershell -NoProfile -ExecutionPolicy Bypass -Command \"& 'D:\\SourceCode\\Kanban0731\\Kanban\\ci\\install-sim-services.ps1' -Action Status\" 2>&1 | tail -4", "Bash=powershell -NoProfile -Command \"Get-Service -Name 'KanbanCollector','KanbanPlcSimulator' -ErrorAction SilentlyContinue | Select-Object Name,Status,StartType | Format-Table\" 2>&1 | head -6; echo \"=== 端口 ===\"; netstat -ano 2>/dev/null | grep -E \"4998|4999|5129\" | head -5; echo \"=== 进程 ===\"; powershell -NoProfile -Command \"Get-CimInstance Win32_Process | Where-Object { \\$_.CommandLine -match 'PlcSimulator|Kanban.Collector' } | Select-Object ProcessId,Name | Format-Table\" 2>&1 | tail -4", "Bash=cd /d/SourceCode/Kanban0731/Kanban && cat > /tmp/overview-analyze.py <<'EOF'\nimport struct, zlib, sys\ndef decode(path):\n    data=open(path,'rb').read(); pos=8; idat=b''; w=h=None\n    while pos<len(data):\n        ln=struct.unpack('>I',data[pos:pos+4])[0]; ct=data[pos+4:pos+8]; ch=data[pos+8:pos+8+ln]\n        if ct==b'IHDR': w,h=struct.unpack('>II',ch[:8])\n        elif ct==b'IDAT': idat+=ch\n        elif ct==b'IEND': break\n        pos+=12+ln\n    raw=zlib.decompress(idat); stride=w*4; out=bytearray(); prev=bytearray(stride); p=0\n    for y in range(h):\n        f=raw[p]; p+=1; line=bytearray(raw[p:p+stride]); p+=stride\n        if f==1:\n            for i in range(4,stride): line[i]=(line[i]+line[i-4])&0xFF\n        elif f==2:\n            for i in range(stride): line[i]=(line[i]+prev[i])&0xFF\n        elif f==3:\n            for i in range(stride):\n                a=line[i-4] if i>=4 else 0; b=prev[i]; line[i]=(line[i]+((a+b)>>1))&0xFF\n        elif f==4:\n            for i in range(stride):\n                a=line[i-4] if i>=4 else 0; b=prev[i]; c=prev[i-4] if i>=4 else 0\n                pa,pb,pc=abs(a+b-c-a),abs(a+b-c-b),abs(a+b-c-c)\n                pr=a if (pa<=pb and pa<=pc) else (b if pb<=pc else c)\n                line[i]=(line[i]+pr)&0xFF\n        out+=line; prev=line\n    return w,h,out\ndef near(c,t,tol=40): return all(abs(a-b)<=tol for a,b in zip(c,t))\nw,h,px=decode(sys.argv[1])\nstats={'ok':0,'ng':0,'quality':0,'text':0,'heat':0}\nfor y in range(h):\n    for x in range(w):\n        o=(y*w+x)*4; r,g,b,a=px[o],px[o+1],px[o+2],px[o+3]\n        if a<40: continue\n        if near((r,g,b),(0x81,0x8C,0xF8),30): stats['ok']+=1\n        elif near((r,g,b),(0xF8,0x71,0x71),30): stats['ng']+=1\n        elif near((r,g,b),(0x34,0xD3,0x99),30): stats['quality']+=1\n        elif near((r,g,b),(0xE5,0xE7,0xEB),30): stats['text']+=1\n        elif near((r,g,b),(0x1E,0x3A,0x5C),60) or near((r,g,b),(0x60,0xA5,0xFA),40): stats['heat']+=1\nprint(f\"OK柱:{stats['ok']} NG柱:{stats['ng']} 良率线:{stats['quality']} 文字:{stats['text']} 热力图:{stats['heat']}\")\nprint(\"OK柱正常\" if stats['ok']>5000 else \"OK柱偏少\", \"| 文字正常\" if stats['text']>1000 else \"| 文字偏少\")\nEOF\npython /tmp/overview-analyze.py screenshots/06_overview.png", "Bash=cd /d/SourceCode/Kanban0731/Kanban && cat > /tmp/ascii3.py <<'EOF'\nimport struct, zlib, sys\ndef decode(path):\n    data=open(path,'rb').read(); pos=8; idat=b''; w=h=None\n    while pos<len(data):\n        ln=struct.unpack('>I',data[pos:pos+4])[0]; ct=data[pos+4:pos+8]; ch=data[pos+8:pos+8+ln]\n        if ct==b'IHDR': w,h=struct.unpack('>II',ch[:8])\n        elif ct==b'IDAT': idat+=ch\n        elif ct==b'IEND': break\n        pos+=12+ln\n    raw=zlib.decompress(idat); stride=w*4; out=bytearray(); prev=bytearray(stride); p=0\n    for y in range(h):\n        f=raw[p]; p+=1; line=bytearray(raw[p:p+stride]); p+=stride\n        if f==1:\n            for i in range(4,stride): line[i]=(line[i]+line[i-4])&0xFF\n        elif f==2:\n            for i in range(stride): line[i]=(line[i]+prev[i])&0xFF\n        elif f==3:\n            for i in range(stride):\n                a=line[i-4] if i>=4 else 0; b=prev[i]; line[i]=(line[i]+((a+b)>>1))&0xFF\n        elif f==4:\n            for i in range(stride):\n                a=line[i-4] if i>=4 else 0; b=prev[i]; c=prev[i-4] if i>=4 else 0\n                pa,pb,pc=abs(a+b-c-a),abs(a+b-c-b),abs(a+b-c-c)\n                pr=a if (pa<=pb and pa<=pc) else (b if pb<=pc else c)\n                line[i]=(line[i]+pr)&0xFF\n        out+=line; prev=line\n    return w,h,out\ndef near(c,t,tol=40): return all(abs(a-b)<=tol for a,b in zip(c,t))\nw,h,px=decode(sys.argv[1])\n# 只看左上趋势图区域 (0..600, 60..320)\nfor ry in range(30):\n    line=[]\n    for rx in range(90):\n        x=int(rx*600/90); y=int(60+ry*260/30)\n        o=(y*w+x)*4; r,g,b,a=px[o],px[o+1],px[o+2],px[o+3]\n        if a<40: ch=' '\n        elif near((r,g,b),(0x81,0x8C,0xF8),30): ch='O'\n        elif near((r,g,b),(0xF8,0x71,0x71),30): ch='N'\n        elif near((r,g,b),(0x34,0xD3,0x99),30): ch='Q'\n        elif near((r,g,b),(0xE5,0xE7,0xEB),30): ch='T'\n        elif near((r,g,b),(0x3A,0x44,0x53),20): ch='G'\n        else: ch='.'\n        line.append(ch)\n    print(''.join(line))\nEOF\npython /tmp/ascii3.py screenshots/06_overview.png", "Bash=cd /d/SourceCode/Kanban0731/Kanban && echo \"=== production_logs 最新时间 ===\" && python - <<'EOF'\nimport sqlite3\ncon = sqlite3.connect(\"file:run-demo/data/Config/production_logs.db?mode=ro\", uri=True)\nprint(\"最新:\", con.execute(\"SELECT MAX(Timestamp) FROM ProductionLogs\").fetchone()[0])\nprint(\"最早:\", con.execute(\"SELECT MIN(Timestamp) FROM ProductionLogs\").fetchone()[0])\nprint(\"条数:\", con.execute(\"SELECT COUN