<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>报警中心 / 安灯页 · 预览</title>
<style>
  :root{
    --bg:#0E1116; --region:#1A2029; --region2:#212834; --dark:#0F1419;
    --border:#2A323F; --border2:#3A4453;
    --t1:#E5E7EB; --t2:#9CA3AF; --t3:#8B92A0;
    --primary:#4F8CFF; --primary-soft:#263040; --hover:#1F2733;
    --run:#34D399; --alarm:#F87171; --pause:#FBBF24; --idle:#9CA3AF;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--t1);font-size:14px;}
  .app{display:flex;height:100vh;}

  /* ---------- 侧边栏（与 MainWindow 一致） ---------- */
  .sidebar{width:208px;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
  .sb-top{display:flex;align-items:center;gap:12px;padding:16px 12px;}
  .sb-logo{width:20px;height:20px;color:var(--primary);}
  .sb-title{font-size:16px;font-weight:700;}
  .sb-sub{font-size:10px;color:var(--t3);letter-spacing:1px;}
  .nav{flex:1;padding:8px 12px;display:flex;flex-direction:column;gap:2px;}
  .nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:var(--t2);cursor:pointer;user-select:none;}
  .nav-item svg{width:18px;height:18px;flex-shrink:0;}
  .nav-item:hover{background:var(--hover);}
  .nav-item.active{background:var(--primary-soft);color:var(--t1);}
  .nav-item.active svg{color:var(--primary);}
  .nav-badge{margin-left:auto;background:var(--alarm);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px;}
  .sb-bottom{border-top:1px solid var(--border);padding:14px 16px;}
  .sb-status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t2);}
  .dot{width:8px;height:8px;border-radius:50%;}
  .dot.green{background:var(--run);} .dot.red{background:var(--alarm);}

  /* ---------- 内容区 ---------- */
  .content{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .topbar{display:flex;align-items:center;gap:16px;padding:18px 28px;border-bottom:1px solid var(--border);}
  .page-title{font-size:20px;font-weight:700;}
  .page-title small{font-size:12px;color:var(--t3);font-weight:400;margin-left:10px;}
  .live{display:flex;align-items:center;gap:6px;color:var(--alarm);font-size:12px;font-weight:600;}
  .live .pulse{width:8px;height:8px;border-radius:50%;background:var(--alarm);animation:pulse 1.4s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(248,113,113,.6);}70%{box-shadow:0 0 0 8px rgba(248,113,113,0);}100%{box-shadow:0 0 0 0 rgba(248,113,113,0);}}
  .clock{margin-left:auto;color:var(--t2);font-variant-numeric:tabular-nums;font-size:13px;}
  .btn{border:1px solid var(--border2);background:var(--region2);color:var(--t1);padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px;}
  .btn:hover{background:var(--hover);}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
  .btn.primary:hover{filter:brightness(1.1);}

  .body{padding:22px 28px;overflow:auto;flex:1;}

  /* KPI 行 */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px;}
  .kpi{background:var(--region);border:1px solid var(--border);border-radius:8px;padding:16px;}
  .kpi .label{color:var(--t3);font-size:12px;margin-bottom:8px;}
  .kpi .val{font-size:28px;font-weight:700;}
  .kpi .val small{font-size:13px;color:var(--t2);font-weight:400;margin-left:4px;}
  .kpi.alarm .val{color:var(--alarm);}
  .kpi.run .val{color:var(--run);}
  .kpi.pause .val{color:var(--pause);}

  /* 主区：左列表 + 右分析 */
  .main{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start;}
  .panel{background:var(--region);border:1px solid var(--border);border-radius:8px;}
  .panel-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);}
  .panel-head h3{font-size:15px;font-weight:600;}
  .filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--border);}
  .chip{border:1px solid var(--border2);background:var(--region2);color:var(--t2);padding:5px 12px;border-radius:14px;cursor:pointer;font-size:12px;}
  .chip:hover{color:var(--t1);}
  .chip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--t1);}
  .search{margin-left:auto;background:var(--dark);border:1px solid var(--border);border-radius:6px;padding:6px 12px;color:var(--t1);width:200px;outline:none;}
  .search::placeholder{color:var(--t3);}

  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:11px 16px;font-size:13px;border-bottom:1px solid var(--border);}
  th{color:var(--t3);font-weight:500;font-size:12px;background:var(--region2);position:sticky;top:0;}
  tbody tr:hover{background:var(--hover);}
  .lvl{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;}
  .lvl.critical{background:rgba(248,113,113,.15);color:var(--alarm);}
  .lvl.major{background:rgba(251,191,36,.15);color:var(--pause);}
  .lvl.minor{background:rgba(79,140,255,.15);color:var(--primary);}
  .st{display:inline-flex;align-items:center;gap:6px;font-size:12px;}
  .st.unack{color:var(--alarm);} .st.acked{color:var(--pause);} .st.recovered{color:var(--run);}
  .row-ack{border:1px solid var(--border2);background:transparent;color:var(--t1);padding:4px 10px;border-radius:5px;cursor:pointer;font-size:12px;}
  .row-ack:hover{background:var(--hover);}
  .row-ack:disabled{opacity:.35;cursor:default;}

  .side{padding:14px 16px;}
  .side h4{font-size:13px;color:var(--t2);margin:4px 0 10px;font-weight:600;}
  .side .block{margin-bottom:20px;}
  .legend{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--t2);}
  .legend span{display:flex;align-items:center;gap:5px;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px;}
  .bar-row .name{width:96px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{flex:1;height:8px;background:var(--region2);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--alarm);border-radius:4px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--region2);border:1px solid var(--border2);color:var(--t1);padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;}
  .toast.show{opacity:1;}
  .hint{color:var(--t3);font-size:12px;padding:10px 16px;border-top:1px solid var(--border);}
</style>
</head>
<body>
<div class="app">
  <!-- ===== 侧边栏 ===== -->
  <aside class="sidebar">
    <div class="sb-top">
      <svg class="sb-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <div>
        <div class="sb-title">看板系统</div>
        <div class="sb-sub">KANBAN SYSTEM</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-item" data-page="主页"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg><span>主页</span></div>
      <div class="nav-item" data-page="产线"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21V9l6 4V9l6 4V5l6 4v12z"/></svg><span>产线</span></div>
      <div class="nav-item active" data-page="报警中心"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span>报警中心</span><span class="nav-badge" id="navBadge">0</span></div>
      <div class="nav-item" data-page="设备"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="6" rx="1"/><circle cx="8" cy="17" r="2"/><circle cx="16" cy="17" r="2"/></svg><span>设备</span></div>
      <div class="nav-item" data-page="历史查询"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/><path d="M12 8v4l3 2"/></svg><span>历史查询</span></div>
      <div class="nav-item" data-page="概览"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l3-4 3 3 4-6"/></svg><span>概览</span></div>
      <div class="nav-item" data-page="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.3 1a7 7 0 0 0-1.7-1l-.3-2.5h-4l-.3 2.5a7 7 0 0 0-1.7 1l-2.3-1-2 3.5 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.3-1a7 7 0 0 0 1.7 1l.3 2.5h4l.3-2.5a7 7 0 0 0 1.7-1l2.3 1 2-3.5-2-1.5a7 7 0 0 0 .1-1z"/></svg><span>设置</span></div>
    </nav>
    <div class="sb-bottom">
      <div class="sb-status"><span class="dot green"></span>PLC 已连接</div>
    </div>
  </aside>

  <!-- ===== 内容区 ===== -->
  <section class="content">
    <div class="topbar">
      <div class="page-title">报警中心 <small>Andon Center · 全局报警的统一入口</small></div>
      <div class="live"><span class="pulse"></span>实时</div>
      <button class="btn" id="ackAll">确认全部未处理</button>
      <button class="btn primary" id="ruleBtn">报警规则配置</button>
      <div class="clock" id="clock">--:--:--</div>
    </div>

    <div class="body">
      <!-- KPI 行 -->
      <div class="kpis">
        <div class="kpi alarm"><div class="label">未处理报警</div><div class="val" id="kpiUnack">0<small>条</small></div></div>
        <div class="kpi"><div class="label">今日新增</div><div class="val" id="kpiToday">0<small>条</small></div></div>
        <div class="kpi pause"><div class="label">平均响应时长</div><div class="val" id="kpiResp">0<small>min</small></div></div>
        <div class="kpi run"><div class="label">已确认 / 恢复率</div><div class="val" id="kpiRate">0<small>%</small></div></div>
      </div>

      <div class="main">
        <!-- 左：报警列表 -->
        <div class="panel">
          <div class="panel-head"><h3>全局报警列表</h3></div>
          <div class="filters">
            <span class="chip on" data-f="level" data-v="all">全部等级</span>
            <span class="chip" data-f="level" data-v="critical">紧急</span>
            <span class="chip" data-f="level" data-v="major">重要</span>
            <span class="chip" data-f="level" data-v="minor">提示</span>
            <span class="chip on" data-f="status" data-v="all" style="margin-left:10px">全部状态</span>
            <span class="chip" data-f="status" data-v="unack">未确认</span>
            <span class="chip" data-f="status" data-v="acked">已确认</span>
            <span class="chip" data-f="status" data-v="recovered">已恢复</span>
            <input class="search" id="search" placeholder="搜索设备 / 产线 / 内容…" />
          </div>
          <table>
            <thead><tr><th>时间</th><th>产线 / 设备</th><th>报警内容</th><th>等级</th><th>状态</th><th>操作</th></tr></thead>
            <tbody id="alarmRows"></tbody>
          </table>
          <div class="hint">点击行内「确认」将报警标记为已确认；「定位」可跳转到对应产线/设备页（预览中未实现）。</div>
        </div>

        <!-- 右：分析 -->
        <div class="panel">
          <div class="side">
            <div class="block">
              <h4>报警等级分布</h4>
              <svg id="donut" viewBox="0 0 160 160" width="160" height="160" style="display:block;margin:0 auto;"></svg>
              <div class="legend">
                <span><i class="dot" style="background:var(--alarm)"></i>紧急 <b id="lgC">0</b></span>
                <span><i class="dot" style="background:var(--pause)"></i>重要 <b id="lgM">0</b></span>
                <span><i class="dot" style="background:var(--primary)"></i>提示 <b id="lgN">0</b></span>
              </div>
            </div>
            <div class="block">
              <h4>近 24h 报警趋势（按小时）</h4>
              <svg id="trend" viewBox="0 0 320 90" width="100%" height="90"></svg>
            </div>
            <div class="block">
              <h4>TOP 报警设备</h4>
              <div id="topDevices"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
// ---------- 模拟数据 ----------
const alarms = [
  {id:1, time:"21:18:04", line:"1号产线", dev:"注塑机 #A1", content:"模具温度超上限 (218℃)", level:"critical", status:"unack"},
  {id:2, time:"21:05:41", line:"3号产线", dev:"主电机 M3", content:"电机电流异常波动", level:"major", status:"unack"},
  {id:3, time:"20:52:13", line:"2号产线", dev:"传送带 C2", content:"光电传感器信号丢失", level:"minor", status:"acked"},
  {id:4, time:"20:40:55", line:"1号产线", dev:"机械臂 R1", content:"气压低于阈值 (0.45MPa)", level:"critical", status:"unack"},
  {id:5, time:"20:31:02", line:"3号产线", dev:"视觉检测 V3", content:"连续 5 件良率低于 95%", level:"major", status:"recovered"},
  {id:6, time:"20:15:30", line:"2号产线", dev:"注塑机 #A2", content:"循环周期超时", level:"minor", status:"acked"},
  {id:7, time:"19:58:47", line:"1号产线", dev:"烘干炉 H1", content:"炉温偏差 ±8℃", level:"major", status:"unack"},
  {id:8, time:"19:42:09", line:"3号产线", dev:"贴标机 L3", content:"标签余量不足 10%", level:"minor", status:"recovered"},
  {id:9, time:"19:20:51", line:"2号产线", dev:"主电机 M2", content:"轴承温度偏高 (78℃)", level:"critical", status:"acked"},
];
const trendData=[3,2,1,4,2,5,3,6,4,3,5,7,4,2,3,5,6,4,3,2,4,5,3,2];

let fLevel="all", fStatus="all", fSearch="";

const $ = s=>document.querySelector(s);
const lvlText={critical:"紧急",major:"重要",minor:"提示"};
const stText={unack:"未确认",acked:"已确认",recovered:"已恢复"};

function render(){
  const rows = alarms.filter(a=>
    (fLevel==="all"||a.level===fLevel) &&
    (fStatus==="all"||a.status===fStatus) &&
    (!fSearch || (a.dev+a.line+a.content).toLowerCase().includes(fSearch.toLowerCase()))
  );
  $("#alarmRows").innerHTML = rows.map(a=>`
    <tr>
      <td style="color:var(--t2)">${a.time}</td>
      <td>${a.line}<br><span style="color:var(--t3);font-size:12px">${a.dev}</span></td>
      <td>${a.content}</td>
      <td><span class="lvl ${a.level}">${lvlText[a.level]}</span></td>
      <td><span class="st ${a.status}">● ${stText[a.status]}</span></td>
      <td>${a.status==="unack"
        ? `<button class="row-ack" onclick="ack(${a.id})">确认</button>`
        : `<button class="row-ack" disabled>—</button>`}
        <button class="row-ack" onclick="toast('定位：'+'${a.line}')">定位</button></td>
    </tr>`).join("") || `<tr><td colspan="6" style="text-align:center;color:var(--t3);padding:24px">无匹配的报警</td></tr>`;

  // KPI
  const unack=alarms.filter(a=>a.status==="unack").length;
  const today=alarms.length;
  const handled=alarms.filter(a=>a.status!=="unack").length;
  $("#kpiUnack").innerHTML=unack+'<small>条</small>';
  $("#kpiToday").innerHTML=today+'<small>条</small>';
  $("#kpiResp").innerHTML=(unack?Math.round(12+Math.random()*8):0)+'<small>min</small>';
  $("#kpiRate").innerHTML=Math.round(handled/today*100)+'<small>%</small>';
  $("#navBadge").textContent=unack;

  // 等级分布
  const c=alarms.filter(a=>a.level==="critical").length;
  const m=alarms.filter(a=>a.level==="major").length;
  const n=alarms.filter(a=>a.level==="minor").length;
  $("#lgC").textContent=c; $("#lgM").textContent=m; $("#lgN").textContent=n;
  drawDonut(c,m,n);

  // TOP 设备
  const devCount={};
  alarms.forEach(a=>devCount[a.dev]=(devCount[a.dev]||0)+1);
  const top=Object.entries(devCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const max=top[0][1];
  $("#topDevices").innerHTML=top.map(([d,v])=>`
    <div class="bar-row"><span class="name">${d}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${v/max*100}%"></div></div>
      <span style="color:var(--t2)">${v}</span></div>`).join("");
  drawTrend();
}

function ack(id){const a=alarms.find(x=>x.id===id);if(a&&a.status==="unack"){a.status="acked";render();toast("已确认："+a.dev);}}

function drawDonut(c,m,n){
  const total=Math.max(1,c+m+n), r=60, cx=80, cy=80, C=2*Math.PI*r;
  const seg=(val,color,offset)=>{const len=val/total*C;return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;};
  let off=0;const parts=[];
  parts.push(seg(c,"#F87171",off));off+=c/total*C;
  parts.push(seg(m,"#FBBF24",off));off+=m/total*C;
  parts.push(seg(n,"#4F8CFF",off));
  $("#donut").innerHTML=parts.join("")+`<text x="${cx}" y="${cy-4}" text-anchor="middle" fill="#E5E7EB" font-size="22" font-weight="700">${total}</text><text x="${cx}" y="${cy+16}" text-anchor="middle" fill="#8B92A0" font-size="11">条报警</text>`;
}
function drawTrend(){
  const w=320,h=90,max=Math.max(...trendData),bw=w/trendData.length;
  let bars=trendData.map((v,i)=>{const bh=v/max*(h-14);return `<rect x="${i*bw+1}" y="${h-bh-2}" width="${bw-2}" height="${bh}" rx="1.5" fill="#4F8CFF" opacity="${0.4+v/max*0.6}"/>`;}).join("");
  $("#trend").innerHTML=bars;
}

// 过滤交互
document.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{
  const f=ch.dataset.f,v=ch.dataset.v;
  document.querySelectorAll(`.chip[data-f="${f}"]`).forEach(x=>x.classList.remove("on"));
  ch.classList.add("on");
  if(f==="level")fLevel=v; else fStatus=v;
  render();
});
$("#search").oninput=e=>{fSearch=e.target.value;render();};

// 顶部按钮
$("#ackAll").onclick=()=>{alarms.forEach(a=>{if(a.status==="unack")a.status="acked";});render();toast("已确认全部未处理报警");};
$("#ruleBtn").onclick=()=>toast("报警规则配置（阈值/等级/通知方式）— 预览未实现");

// 导航（预览仅高亮）
document.querySelectorAll(".nav-item").forEach(it=>it.onclick=()=>{
  document.querySelectorAll(".nav-item").forEach(x=>x.classList.remove("active"));
  it.classList.add("active");
  if(it.dataset.page!=="报警中心")toast("预览模式：仅展示「报警中心」页");
});

function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1800);}

// 时钟
function tick(){$("#clock").textContent=new Date().toLocaleTimeString("zh-CN",{hour12:false});}
setInterval(tick,1000);tick();
render();
</script>
</body>
</html>
